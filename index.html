<section class="panel">
  <h2>Options</h2>

  <fieldset>
    <legend>Identifier style (pick one)</legend>
    <label><input type="radio" name="idstyle" value="rename" checked> Rename &nbsp;<code>_0x0001</code></label>
    <label><input type="radio" name="idstyle" value="mangle"> Mangle &nbsp;<code>_l1O0S5Zz</code></label>
    <label><input type="radio" name="idstyle" value="sflood"> S-Flood &nbsp;<code>SSSSSS</code></label>
    <label><input type="radio" name="idstyle" value="none"> None</label>
  </fieldset>

  <fieldset>
    <legend>String encoding (stackable)</legend>
    <label><input type="checkbox" id="str-xor" checked> XOR</label>
    <label><input type="checkbox" id="str-b64"> Base64</label>
    <label><input type="checkbox" id="str-caesar"> Caesar</label>
  </fieldset>

  <label><input type="checkbox" id="opt-env" checked> Environment hiding</label>
  <label><input type="checkbox" id="opt-deadcode" checked> Dead-code injection</label>
  <label><input type="checkbox" id="opt-numsplit" checked> Number splitting</label>
  <label><input type="checkbox" id="opt-flatten" checked> Strong control-flow flattening</label>
  <label><input type="checkbox" id="opt-vm"> VM wrapper (loadstring)</label>
  <label><input type="checkbox" id="opt-minify"> Minify output</label>

  <button id="obfuscate-btn">Obfuscate</button>
</section>
